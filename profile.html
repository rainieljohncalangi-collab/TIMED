<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile - TestSync</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style> 
        /* CSS Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 250px;
            min-height: 100vh;
            background-color: maroon;
            color: white;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 0.02em;
            padding: 0 16px 22px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            margin-bottom: 20px;
        }

        .sidebar-logo {
            display: block;
            width: 48px;
            height: 48px;
            flex: 0 0 auto;
            border-radius: 50%;
            background: #fff;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.22);
            object-fit: contain;
        }

        .sidebar a, .dropdown-btn {
            display: block;
            color: #bdc3c7;
            padding: 15px 25px;
            text-decoration: none;
            font-size: 16px;
            background: none;
            border: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
        }

        .sidebar a:hover, .sidebar a.active, .dropdown-btn:hover {
            background-color: #600000;
            color: white;
        }

        .dropdown-container {
            display: block; 
            background-color: #4a0000;
            padding-left: 15px;
        }

        .dropdown-container a {
            padding: 12px 25px;
            font-size: 14px;
        }

        /* MAIN CONTAINER */
        .main-container {
            flex: 1;
            position: relative;
            display: flex;
            background-color: #f0f2f5;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.88), rgba(255, 255, 255, 0.88)),
                url("pantay-school-logo-transparent.png");
            background-position: center, center;
            background-size: 100% 100%, auto 100%;
            background-repeat: no-repeat;
            padding: 52px 40px 40px;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
        }

        .main-container::before {
            position: absolute;
            top: 0;
            right: 0;
            left: 0;
            height: 12px;
            background: maroon;
            content: '';
        }

        /* HORIZONTAL PROFILE BOARD */
        .profile-board {
            display: flex;
            width: 100%;
            max-width: 1000px;
            background: transparent;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            overflow: hidden;
            min-height: 500px;
        }

        /* LEFT BRAND PANEL */
        .profile-left-panel {
            width: 30%;
            background-color: maroon;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            border-right: 1px solid rgba(0, 0, 0, 0.05);
        }

        .avatar-wrapper {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #fff;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 4px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        .avatar-wrapper i {
            font-size: 70px;
            color: maroon;
        }

        .welcome-text {
            font-size: 14px;
            color: #e0e0e0;
            margin-bottom: 5px;
        }

        .profile-name {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            word-break: break-word;
        }

        /* RIGHT CONTENT CONTAINER */
        .profile-right-content {
            width: 70%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* TWO COLUMN GRID */
        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        .column-title {
            font-size: 15px;
            color: maroon;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ROW STYLING */
        .settings-row {
            display: flex;
            align-items: center;
            padding: 14px 12px;
            border-radius: 10px;
            background-color: #f8f9fa;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: #333;
            border: 1px solid #edf0f2;
        }

        .settings-row:hover {
            background-color: #f0f2f5;
            transform: translateY(-1px);
        }

        .row-icon {
            width: 30px;
            font-size: 16px;
            color: maroon;
            text-align: center;
        }

        .row-text {
            flex: 1;
            font-size: 15px;
            font-weight: 500;
            padding-left: 10px;
        }

        .row-value {
            font-size: 13px;
            color: #7f8c8d;
            margin-right: 8px;
        }

        .row-arrow {
            color: #bdc3c7;
            font-size: 12px;
        }

        /* ACTIONS PANEL */
        .actions-panel {
            margin-top: 30px;
            border-top: 1px solid #edf0f2;
            padding-top: 20px;
            display: flex;
            justify-content: flex-end;
        }

        .logout-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .logout-btn:hover {
            background-color: #bd2130;
        }

        /* ====== RESPONSIVE DESIGN FOR MOBILE DEVICES ====== */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                overflow: auto;
                height: auto;
                min-height: 100vh;
            }

            .sidebar {
                width: 100%;
                min-height: 0;
                flex-direction: row;
                flex-wrap: wrap;
                padding: 10px 15px;
                align-items: center;
                gap: 5px;
                flex-shrink: 0;
            }

            .sidebar-title {
                justify-content: flex-start;
                flex: 1 0 100%;
                font-size: 22px;
                padding: 0 0 10px;
                border-bottom: none;
                margin-bottom: 0;
            }

            .sidebar-logo { width: 44px; height: 44px; }

            .sidebar a, .dropdown-btn {
                padding: 12px 14px;
                font-size: 14px;
                width: auto;
            }

            .dropdown-container {
                width: 100%;
            }

            .dropdown-container a {
                padding: 10px 20px;
                font-size: 14px;
            }

            .main-container {
                padding: 28px 16px 16px;
                align-items: stretch;
            }

            .profile-board {
                flex-direction: column;
                min-height: auto;
                border-radius: 16px;
            }

            .profile-left-panel {
                width: 100%;
                padding: 30px 20px;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.1);
            }

            .avatar-wrapper {
                width: 100px;
                height: 100px;
            }

            .avatar-wrapper i {
                font-size: 55px;
            }

            .profile-name {
                font-size: 18px;
            }

            .profile-right-content {
                width: 100%;
                padding: 24px 20px;
            }

            .settings-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .column-title {
                font-size: 14px;
            }

            .settings-row {
                padding: 14px 12px;
            }

            .row-text {
                font-size: 14px;
            }

            .actions-panel {
                justify-content: stretch;
            }

            .logout-btn {
                width: 100%;
                justify-content: center;
                padding: 14px;
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            .sidebar a, .dropdown-btn {
                padding: 10px 8px;
                font-size: 12px;
            }

            .sidebar-title {
                font-size: 20px;
            }

            .sidebar-logo { width: 40px; height: 40px; }

            .profile-name {
                font-size: 16px;
            }
        }
        </style>
        <link rel="stylesheet" href="responsive.css">
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-title">
            <img class="sidebar-logo" src="testSync-brand-mark.png" alt="">
            <span>TestSync</span>
        </div>
        <a href="dashboard.html">Home</a>
        <a href="quizzes.html">Quizzes</a>
        <a href="students.html">Students & Scores</a>
        
        <button class="dropdown-btn" onclick="toggleDropdown()">Account ▾</button>
        <div class="dropdown-container" id="accountDropdown">
            <a href="profile.html" class="active">Profile Settings</a>
        </div>
    </div>

    <div class="main-container">
        
        <div class="profile-board">
            
            <div class="profile-left-panel">
                <div class="avatar-wrapper" id="profileImageContainer">
                    <i class="fa-solid fa-circle-user"></i>
                </div>
                <div class="welcome-text">Welcome,</div>
                <div class="profile-name" id="displayProfileName">Loading profile...</div>
            </div>

            <div class="profile-right-content">
                
                <div class="settings-grid">
                    
                    <div class="grid-column">
                        <div class="column-title"><i class="fa-solid fa-user-gear"></i> Account Settings</div>
                        
                        <div class="settings-row">
                            <div class="row-icon"><i class="fa-solid fa-user"></i></div>
                            <div class="row-text">Edit Profile</div>
                            <div class="row-value" id="infoUsername">---</div>
                            <div class="row-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                        </div>

                        <div class="settings-row">
                            <div class="row-icon"><i class="fa-solid fa-envelope"></i></div>
                            <div class="row-text">Email Address</div>
                            <div class="row-value" id="infoEmail">---</div>
                            <div class="row-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                        </div>

                        <div class="settings-row">
                            <div class="row-icon"><i class="fa-solid fa-shield-halved"></i></div>
                            <div class="row-text">Account Role</div>
                            <div class="row-value" id="infoRole">TEACHER</div>
                            <div class="row-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                        </div>
                    </div>

                    <div class="grid-column">
                        <div class="column-title"><i class="fa-solid fa-laptop-code"></i> Storage & Cache</div>

                        <div class="settings-row">
                            <div class="row-icon"><i class="fa-solid fa-lock"></i></div>
                            <div class="row-text">Privacy & Access</div>
                            <div class="row-value" style="color: green; font-weight: bold;">Active</div>
                            <div class="row-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                        </div>

                        <div class="settings-row">
                            <div class="row-icon"><i class="fa-solid fa-trash-can"></i></div>
                            <div class="row-text">Storage Used</div>
                            <div class="row-value">0 KB</div>
                            <div class="row-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                        </div>
                    </div>

                </div>

                <div class="actions-panel">
                    <button class="logout-btn" onclick="logout()">
                        <i class="fa-solid fa-right-from-bracket"></i> Log Out
                    </button>
                </div>

            </div>
        </div>

    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const currentUserData = localStorage.getItem('currentScanCheckUser');

            if (!currentUserData) {
                window.location.href = "log.html";
                return;
            }

            const loggedInUser = JSON.parse(currentUserData);

            document.getElementById('displayProfileName').innerText = loggedInUser.username;
            document.getElementById('infoUsername').innerText = loggedInUser.username;
            
            if (loggedInUser.email) {
                document.getElementById('infoEmail').innerText = loggedInUser.email;
            } else {
                document.getElementById('infoEmail').innerText = loggedInUser.username + "@testsync.edu";
            }

            document.getElementById('infoRole').innerText = (loggedInUser.role || 'teacher').toUpperCase();

            if (loggedInUser.profilePic) {
                const imageContainer = document.getElementById('profileImageContainer');
                imageContainer.innerHTML = `<img src="${loggedInUser.profilePic}" alt="User Avatar" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
            }
        });

        function toggleDropdown() {
            const dropdown = document.getElementById('accountDropdown');
            dropdown.style.display = (dropdown.style.display === "block") ? "none" : "block";
        }

        function logout() {
            localStorage.removeItem('currentScanCheckUser');
            window.location.href = "log.html";
        }
    </script>
</body>
</html>
